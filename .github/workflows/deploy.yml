name: Deploy Laravel to cPanel and GCP VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # JOB 1: DEPLOY KE CPANEL (Existing)
  # ==========================================
  deploy-cpanel:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Build to Laravel Core
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./public/build/
          server-dir: /laravel/public/build/
          state-name: .ftp-deploy-sync-state.json

      - name: Deploy Laravel Core
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: /laravel/
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            public/**
            node_modules/**
            .git/**
            .github/**
            tests/**
            storage/logs/**
            .env

      - name: Replace index.php for production
        run: cp public/index.production.php public/index.php

      - name: Deploy Public Folder
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./public/
          server-dir: /public_html/resonan/
          state-name: .ftp-deploy-sync-state.json

  # ==========================================
  # JOB 2: DEPLOY KE GCP VPS (Docker Container)
  # ==========================================
  deploy-vps:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for project file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            project:
              - '**'
              - '!.github/**'
              - '!README.md'
              - '!SECURITY.md'
              - '!tests/**'
              - '!phpunit.xml'
              - '!.editorconfig'
              - '!.gitignore'
              - '!.env.example'

      - name: Report change status
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Workflow triggered manually. Running Docker build and deployment."
          elif [ "${{ steps.filter.outputs.project }}" = "true" ]; then
            echo "Project files changed. Proceeding with Docker build and deployment."
          else
            echo "No project changes detected. Skipping Docker build and deployment."
          fi

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.project == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.project == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.project == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=latest

      - name: Build and push Docker image
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.project == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.project == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/lpmunsika-app
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker compose -f docker-compose.prod.yml pull app
            sudo docker compose -f docker-compose.prod.yml up -d
            sudo docker image prune -f
