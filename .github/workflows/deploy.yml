name: Deploy Laravel to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Node setup
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Build Vite
      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        run: npm run build

      # 4. PHP setup
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Install Composer
        run: composer install --no-dev --optimize-autoloader

      # 5. Deploy Laravel core
      - name: Deploy Core Laravel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: /home/lpmunsik/laravel/
          exclude: |
            public/**
            node_modules/**
            .git/**
            .github/**
            tests/**
            storage/logs/**

      # 6. Deploy public (SUDAH termasuk build)
      - name: Deploy Public Folder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./public/
          server-dir: /public_html/resonan/

      # 7. Copy build ke Laravel core (biar manifest terbaca)
      - name: Deploy Build to Laravel Core
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./public/build/
          server-dir: /home/lpmunsik/laravel/public/build/
