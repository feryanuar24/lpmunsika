services:
    app:
        build:
            context: .
            target: development
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        container_name: lpmunsika-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        networks:
            - lpmunsika-network
        environment:
            DB_HOST: mysql
        depends_on:
            mysql:
                condition: service_healthy

    nginx:
        image: nginx:alpine
        container_name: lpmunsika-nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - lpmunsika-network
        depends_on:
            - app

    mysql:
        image: mysql:8.4
        container_name: lpmunsika-mysql
        restart: unless-stopped
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --performance_schema=OFF
            - --innodb_buffer_pool_size=64M
            - --innodb_log_buffer_size=16M
            - --max_connections=50
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
            MYSQL_DATABASE: ${DB_DATABASE:-lpmunsika}
        ports:
            - "3307:3306"
        volumes:
            - lpmunsika-mysql-data:/var/lib/mysql
        networks:
            - lpmunsika-network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}",
                ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 15s

    node:
        image: node:24-alpine
        container_name: lpmunsika-node
        restart: unless-stopped
        init: true
        user: "${UID:-1000}:${GID:-1000}"
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        ports:
            - "5173:5173"
        networks:
            - lpmunsika-network
        command: sh -c "npm install && npm run dev"

networks:
    lpmunsika-network:
        driver: bridge

volumes:
    lpmunsika-mysql-data:
        driver: local
