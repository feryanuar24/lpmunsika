services:
    app:
        build: .
        container_name: laravel-app
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - laravel
        extra_hosts:
            - "host.docker.internal:host-gateway"
        env_file:
            - .env

    nginx:
        image: nginx:latest
        container_name: laravel-nginx
        ports:
            - "8080:80"
        volumes:
            - .:/var/www
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - laravel

    node:
        image: node:20
        container_name: laravel-node
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - laravel
        command: tail -f /dev/null

networks:
    laravel:
