services:
  app:
    build:
      context: .
      target: production
    container_name: lpmunsika-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - lpmunsika-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      alarik:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: lpmunsika-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lpmunsika-network
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: lpmunsika-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --performance_schema=OFF
      - --innodb_buffer_pool_size=64M
      - --innodb_log_buffer_size=16M
      - --max_connections=50
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-lpmunsika}
      MYSQL_USER: ${DB_USERNAME:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - lpmunsika-mysql-data:/var/lib/mysql
    networks:
      - lpmunsika-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:alpine
    container_name: lpmunsika-redis
    restart: unless-stopped
    volumes:
      - lpmunsika-redis-data:/data
    networks:
      - lpmunsika-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  alarik:
    image: ghcr.io/achtungsoftware/alarik:latest
    container_name: lpmunsika-alarik
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      API_BASE_URL: ${ALARIK_API_URL:-http://localhost:8080}
      CONSOLE_BASE_URL: ${ALARIK_CONSOLE_URL:-http://localhost:3000}
      ADMIN_USERNAME: ${ALARIK_ADMIN_USERNAME:-alarik}
      ADMIN_PASSWORD: ${ALARIK_ADMIN_PASSWORD:-alarik}
      JWT: ${ALARIK_JWT_SECRET:-change_this_to_a_secure_random_string}
      ALLOW_ACCOUNT_CREATION: ${ALARIK_ALLOW_ACCOUNT_CREATION:-false}
    volumes:
      - lpmunsika-alarik-data:/app/Storage
    networks:
      - lpmunsika-network

  alarik-console:
    image: ghcr.io/achtungsoftware/alarik-console:latest
    container_name: lpmunsika-alarik-console
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${ALARIK_API_URL:-http://localhost:8080}
      NUXT_PUBLIC_CONSOLE_BASE_URL: ${ALARIK_CONSOLE_URL:-http://localhost:3000}
      NUXT_PUBLIC_ALLOW_ACCOUNT_CREATION: ${ALARIK_ALLOW_ACCOUNT_CREATION:-false}
    depends_on:
      - alarik
    networks:
      - lpmunsika-network

networks:
  lpmunsika-network:
    driver: bridge

volumes:
  lpmunsika-mysql-data:
    driver: local
  lpmunsika-redis-data:
    driver: local
  lpmunsika-alarik-data:
    driver: local
